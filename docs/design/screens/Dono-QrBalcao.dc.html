<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Dono, QR do balcão</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1000px; overflow: hidden; background: #F7F6F2; font-family: Manrope, system-ui, sans-serif">
<div style="position: absolute; top: 48px; left: 12px">
<dc-import name="BotaoIcone" icone="arrowLeft" rotulo="Voltar" hint-size="44px,44px"></dc-import>
</div>
<div style="padding: 112px 24px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 32px; line-height: 37px; font-weight: 800; letter-spacing: -0.5px; color: #16181B">QR do balcão</h1>
<p style="margin: 0; font-size: 17px; line-height: 26px; color: #5B6068">Imprima e deixe à vista. O cliente lê com a câmera e abre os seus cartões.</p>
</div>
<div style="box-sizing: border-box; padding: 32px 24px; border-radius: 24px; background: #FFFFFF; border: 1.5px solid #E2DED3; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
<dc-import name="Icone" icone="qr" size="240" color="#16181B" hint-size="240px,240px"></dc-import>
<span style="font-size: 17px; line-height: 24px; font-weight: 700; color: #16181B">Barbearia Navalha</span>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<dc-import name="Botao" label="Imprimir QR Code" hint-size="100%,56px"></dc-import>
<dc-import name="Botao" label="Compartilhar imagem" variant="secondary" hint-size="100%,56px"></dc-import>
</div>
<div style="box-sizing: border-box; padding: 20px 16px; border-radius: 20px; background: #FFFFFF; border: 1.5px solid #E2DED3; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 700; color: #16181B">Endereço para a etiqueta NFC</h2>
<span style="font-size: 17px; line-height: 24px; font-weight: 600; color: #16181B; word-break: break-all">fregues.com.br/s/navalha</span>
<dc-import name="Botao" label="Copiar endereço" variant="secondary" size="small" hint-size="100%,44px"></dc-import>
<span style="font-size: 14px; line-height: 20px; color: #5B6068">Grave este endereço na etiqueta. Ele não muda, então QR e etiquetas já distribuídos continuam valendo.</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
