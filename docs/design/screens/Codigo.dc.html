<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Código de verificação</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 12px; width: 100%; font-family: Manrope, system-ui, sans-serif">
<div style="position: relative; display: flex; gap: 8px; width: 100%">
<sc-for list="{{caixas}}" as="c" hint-placeholder-count="6">
<div style="{{c.style}}">{{c.digito}}</div>
</sc-for>
<input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="Código de verificação de 6 dígitos" value="{{valor}}" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; border: none; padding: 0">
</div>
<sc-if value="{{temMensagem}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 14px; line-height: 20px; color: #B3261E">{{mensagem}}</span>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"valor":{"editor":"text","default":""},"estado":{"editor":"enum","default":"default","options":["default","error"]},"mensagem":{"editor":"text","default":""},"$preview":{"width":342,"height":56}}'>
class Component extends DCLogic {
renderVals() {
const valor = String(this.props.valor ?? '').slice(0, 6);
const estado = this.props.estado ?? 'default';
const mensagem = this.props.mensagem ?? '';
const caixas = [];
for (let i = 0; i < 6; i++) {
const ativa = estado === 'default' && i === valor.length;
const border = estado === 'error' ? '#B3261E' : '#8C8678';
const ring = ativa ? 'outline:2px solid #16181B;outline-offset:2px;' : '';
caixas.push({
digito: valor[i] ?? '',
style: 'flex:1;min-width:0;height:56px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#FFFFFF;border:1.5px solid ' + border + ';font-size:24px;line-height:30px;font-weight:700;color:#16181B;' + ring
});
}
return { caixas, valor, mensagem, temMensagem: mensagem !== '' };
}
}
</script>
</body>
</html>
