<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Botão</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<button type="button" disabled="{{desativado}}" style="{{style}}">{{label}}</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Continuar"},"variant":{"editor":"enum","default":"primary","options":["primary","secondary","ghost"]},"size":{"editor":"enum","default":"large","options":["large","small"]},"desativado":{"editor":"boolean","default":false},"$preview":{"width":342,"height":56}}'>
class Component extends DCLogic {
renderVals() {
const variant = this.props.variant ?? 'primary';
const size = this.props.size ?? 'large';
const base = 'display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-radius:12px;font-family:Manrope,system-ui,sans-serif;cursor:pointer;white-space:nowrap;';
const sizes = {
large: 'width:100%;height:56px;font-size:17px;font-weight:700;line-height:24px;',
small: 'height:44px;padding:0 16px;font-size:14px;font-weight:600;line-height:20px;'
};
const variants = {
primary: 'background:#F2B84B;color:#1A1305;border:none;',
secondary: 'background:#FFFFFF;color:#16181B;border:1.5px solid #8C8678;',
ghost: 'background:transparent;color:#5B6068;border:none;'
};
const desativado = this.props.desativado === true || this.props.desativado === 'true';
const off = 'background:#E2DED3;color:#5B6068;border:none;cursor:not-allowed;';
return { label: this.props.label ?? 'Continuar', desativado, style: base + sizes[size] + variants[variant] + (desativado ? off : '') };
}
}
</script>
</body>
</html>
