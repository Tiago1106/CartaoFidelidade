<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Indicador</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="box-sizing: border-box; width: 100%; height: 100%; padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1.5px solid #E2DED3; display: flex; flex-direction: column; gap: 4px; font-family: Manrope, system-ui, sans-serif">
<span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #5B6068">{{rotulo}}</span>
<span style="font-size: 32px; line-height: 37px; font-weight: 800; letter-spacing: -0.5px; color: #16181B">{{valor}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"rotulo":{"editor":"text","default":"Visitas"},"valor":{"editor":"text","default":"128"},"$preview":{"width":165,"height":97}}'>
class Component extends DCLogic {
renderVals() {
return { rotulo: this.props.rotulo ?? 'Visitas', valor: this.props.valor ?? '0' };
}
}
</script>
</body>
</html>
