# A fixed project name: the folder name has an accent and a space, and would give the
# containers and the volume a name that depends on where the repository was cloned.
name: fregues

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fregues
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fregues']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
